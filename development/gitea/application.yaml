apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitea
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://dl.gitea.io/charts/
      chart: gitea
      targetRevision: "12.7.0"
      helm:
        valueFiles:
          - $values/development/gitea/values.yaml
    - repoURL: https://github.com/thepaixaosilva/homelab.git
      targetRevision: main-kubernetes
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: gitea
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true