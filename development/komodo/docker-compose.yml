services:
  komodo-mongo:
    container_name: komodo-mongo
    image: mongo
    command: --quiet --wiredTigerCacheSizeGB 0.25

    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers

    volumes:
      - ${DATA_DIR}/komodo:/data/db
      - ${CONFIG_DIR}/komodo:/data/configdb

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${KOMODO_DATABASE_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${KOMODO_DATABASE_PASSWORD}
      GLIBC_TUNABLES: "glibc.pthread.rseq=1" # temporary workaround for rseq issues related to linux kernel 6.19+, as identified here: https://github.com/debezium/dbz/issues/1945

    networks:
      - proxy

    restart: unless-stopped

  komodo-core:
    container_name: komodo-core
    image: ghcr.io/moghtech/komodo-core:${COMPOSE_KOMODO_IMAGE_TAG:-2}
    init: true
    restart: unless-stopped
    depends_on:
      - komodo-mongo

    ports:
      - 9120:9120

    environment:
      TZ: ${TZ}
      KOMODO_DATABASE_ADDRESS: komodo-mongo:27017
      KOMODO_DATABASE_USERNAME: ${KOMODO_DATABASE_USERNAME}
      KOMODO_DATABASE_PASSWORD: ${KOMODO_DATABASE_PASSWORD}
      KOMODO_HOST: ${KOMODO_HOST}
      KOMODO_TITLE: ${KOMODO_TITLE}
      KOMODO_PERIPHERY_PUBLIC_KEY: ${KOMODO_PERIPHERY_PUBLIC_KEY}
      KOMODO_LOCAL_AUTH: ${KOMODO_LOCAL_AUTH}
      KOMODO_INIT_ADMIN_USERNAME: ${KOMODO_INIT_ADMIN_USERNAME}
      KOMODO_INIT_ADMIN_PASSWORD: ${KOMODO_INIT_ADMIN_PASSWORD}
      KOMODO_FIRST_SERVER_NAME: ${KOMODO_FIRST_SERVER_NAME}
      KOMODO_DISABLE_CONFIRM_DIALOG: ${KOMODO_DISABLE_CONFIRM_DIALOG}
      KOMODO_DISABLE_INIT_RESOURCES: ${KOMODO_DISABLE_INIT_RESOURCES}
      KOMODO_DEFAULT_PAGINATION_LIMIT: ${KOMODO_DEFAULT_PAGINATION_LIMIT}
      KOMODO_WEBHOOK_SECRET: ${KOMODO_WEBHOOK_SECRET}
      KOMODO_JWT_SECRET: ${KOMODO_JWT_SECRET}
      KOMODO_JWT_TTL: ${KOMODO_JWT_TTL}
      KOMODO_MONITORING_INTERVAL: ${KOMODO_MONITORING_INTERVAL}
      KOMODO_RESOURCE_POLL_INTERVAL: ${KOMODO_RESOURCE_POLL_INTERVAL}
      KOMODO_DISABLE_USER_REGISTRATION: ${KOMODO_DISABLE_USER_REGISTRATION}
      KOMODO_ENABLE_NEW_USERS: ${KOMODO_ENABLE_NEW_USERS}
      KOMODO_DISABLE_NON_ADMIN_CREATE: ${KOMODO_DISABLE_NON_ADMIN_CREATE}
      KOMODO_TRANSPARENT_MODE: ${KOMODO_TRANSPARENT_MODE}
      KOMODO_OIDC_ENABLED: ${KOMODO_OIDC_ENABLED}
      KOMODO_GITHUB_OAUTH_ENABLED: ${KOMODO_GITHUB_OAUTH_ENABLED}
      KOMODO_GOOGLE_OAUTH_ENABLED: ${KOMODO_GOOGLE_OAUTH_ENABLED}
      KOMODO_LOGGING_PRETTY: ${KOMODO_LOGGING_PRETTY:-false}
      KOMODO_PRETTY_STARTUP_CONFIG: ${KOMODO_PRETTY_STARTUP_CONFIG:-false}

    volumes:
      - ${CONFIG_DIR}/komodo/keys:/config/keys
      - ${BACKUP_DIR}/komodo:/backups

    networks:
      - proxy

  komodo-periphery:
    container_name: komodo-periphery
    image: ghcr.io/moghtech/komodo-periphery:${COMPOSE_KOMODO_IMAGE_TAG:-2}
    init: true
    restart: unless-stopped
    depends_on:
      - komodo-core
    environment:
      PERIPHERY_CORE_ADDRESS: ${PERIPHERY_CORE_ADDRESS}
      PERIPHERY_CONNECT_AS: ${PERIPHERY_CONNECT_AS}
      PERIPHERY_CORE_PUBLIC_KEYS: ${PERIPHERY_CORE_PUBLIC_KEYS}
      PERIPHERY_ROOT_DIRECTORY: ${PERIPHERY_ROOT_DIRECTORY:-/etc/komodo}
      PERIPHERY_DISABLE_TERMINALS: ${PERIPHERY_DISABLE_TERMINALS}
      PERIPHERY_DISABLE_CONTAINER_TERMINALS: ${PERIPHERY_DISABLE_CONTAINER_TERMINALS}
      PERIPHERY_INCLUDE_DISK_MOUNTS: ${PERIPHERY_INCLUDE_DISK_MOUNTS}
      PERIPHERY_LOGGING_PRETTY: ${PERIPHERY_LOGGING_PRETTY:-false}
      PERIPHERY_PRETTY_STARTUP_CONFIG: ${PERIPHERY_PRETTY_STARTUP_CONFIG:-false}
      TZ: ${TZ}
    volumes:
      - ${CONFIG_DIR}/komodo/keys:/config/keys

      ## Mount external docker socket
      - /var/run/docker.sock:/var/run/docker.sock

      ## Allow Periphery to see processes outside of container
      - /proc:/proc

      ## Mount the Periphery root directory
      - ${PERIPHERY_ROOT_DIRECTORY:-/etc/komodo}:${PERIPHERY_ROOT_DIRECTORY:-/etc/komodo}

    networks:
      - proxy

networks:
  proxy:
    external: true
